<!-- index.html (UPDATED) -->
<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>

    <link rel="stylesheet" href="./src/output.css" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            boxShadow: {
              soft: "0 18px 55px rgba(0,0,0,0.10)",
              softer: "0 12px 28px rgba(0,0,0,0.08)",
            },
            borderRadius: {
              "4xl": "2rem",
              "5xl": "2.5rem",
            },
          },
        },
      };
    </script>

    <link rel="icon" href="./assets/icons/favicon.ico" />
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-50">
    <!-- Background -->
    <div aria-hidden="true" class="fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute inset-0 bg-[linear-gradient(135deg,rgba(236,254,255,0.95)_0%,rgba(248,250,252,0.98)_38%,rgba(255,241,242,0.7)_100%)] dark:bg-[linear-gradient(135deg,rgba(8,47,73,0.55)_0%,rgba(2,6,23,0.98)_45%,rgba(76,5,25,0.42)_100%)]"
      ></div>
      <div class="absolute inset-0 opacity-[0.06] dark:opacity-[0.08]">
        <div
          class="h-full w-full bg-[linear-gradient(rgba(15,23,42,0.55)_1px,transparent_1px),linear-gradient(90deg,rgba(15,23,42,0.55)_1px,transparent_1px)] dark:bg-[linear-gradient(rgba(226,232,240,0.38)_1px,transparent_1px),linear-gradient(90deg,rgba(226,232,240,0.38)_1px,transparent_1px)] [background-size:28px_28px]"
        ></div>
      </div>
    </div>

    <!-- Sticky Navbar -->
    <header
      class="sticky top-0 z-50 border-b border-cyan-100/80 bg-white/80 backdrop-blur-xl dark:border-cyan-950/70 dark:bg-slate-950/75"
    >
      <nav
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3"
      >
        <a
          href="#home"
          class="flex items-center gap-2 font-semibold tracking-tight"
        >
          <span
            class="hidden h-9 w-9 items-center justify-center rounded-lg bg-cyan-700 text-white shadow-sm dark:bg-cyan-300 dark:text-slate-950"
            >AR</span
          >
          <span id="navName" class="sm:block">Portfolio</span>
        </a>

        <div
          class="hidden items-center gap-5 text-sm font-medium text-slate-600 dark:text-slate-300 md:flex"
        >
          <!-- <a class="hover:text-slate-900 dark:hover:text-white" href="#about">About</a> -->
          <a id="navRoles" class="hover:text-slate-900 dark:hover:text-white" href="#filters"
            >Roles</a
          >
          <a id="navSkills" class="hover:text-slate-900 dark:hover:text-white" href="#skills"
            >Skills</a
          >
          <a id="navProjects" class="hover:text-slate-900 dark:hover:text-white" href="#projects"
            >Projects</a
          >
          <a
            id="navExperience"
            class="hover:text-slate-900 dark:hover:text-white"
            href="#experience"
            >Experience</a
          >
          <a
            id="navEducation"
            class="hover:text-slate-900 dark:hover:text-white"
            href="#education"
            >Education</a
          >
          <a id="navContact" class="hover:text-slate-900 dark:hover:text-white" href="#contact"
            >Contact</a
          >
        </div>

        <div class="flex items-center gap-2">
          <button
            id="langToggle"
            class="inline-flex items-center gap-2 rounded-lg border border-cyan-100 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-cyan-50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-cyan-950/40"
            type="button"
            aria-label="Toggle language"
          >
            <i data-lucide="languages" class="h-4 w-4"></i>
            <span class="hidden sm:inline" id="langToggleText">FA</span>
          </button>

          <button
            id="themeToggle"
            class="inline-flex items-center gap-2 rounded-lg border border-cyan-100 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-cyan-50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-cyan-950/40"
            type="button"
            aria-label="Toggle dark mode"
          >
            <i data-lucide="moon" class="h-4 w-4"></i>
            <span class="hidden sm:inline">Theme</span>
          </button>

          <button
            id="mobileMenuBtn"
            class="md:hidden inline-flex items-center gap-2 rounded-lg border border-cyan-100 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-cyan-50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-cyan-950/40"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <i data-lucide="menu" class="h-4 w-4"></i>
          </button>
        </div>
      </nav>

      <div
        id="mobileMenu"
        class="hidden border-t border-slate-200 bg-white/80 px-4 py-3 backdrop-blur-xl dark:border-slate-800 dark:bg-slate-950/70 md:hidden"
      >
        <div
          class="grid grid-cols-2 gap-2 text-sm text-slate-700 dark:text-slate-200"
        >
          <a
            id="mNavAbout"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#about"
            >About</a
          >
          <a
            id="mNavRoles"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#filters"
            >Roles</a
          >
          <a
            id="mNavSkills"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#skills"
            >Skills</a
          >
          <a
            id="mNavProjects"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#projects"
            >Projects</a
          >
          <a
            id="mNavExperience"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#experience"
            >Experience</a
          >
          <a
            id="mNavEducation"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#education"
            >Education</a
          >
          <a
            id="mNavContact"
            class="rounded-xl px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-900"
            href="#contact"
            >Contact</a
          >
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4">
      <!-- Hero -->
      <section id="home" class="py-10 sm:py-14">
        <div class="grid items-center gap-10 lg:grid-cols-[.65fr_1.35fr]">
          <div class="flex justify-center lg:justify-start">
            <div
              class="w-full max-w-xs rounded-lg border border-cyan-100 bg-white/90 p-4 shadow-soft backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/70"
            >
              <div
                id="profileFrame"
                class="aspect-square overflow-hidden rounded-lg bg-slate-100 opacity-0 translate-y-2 transition duration-700 ease-out dark:bg-slate-800"
              >
                <img
                  id="profileImg"
                  src="./assets/images/profile.jpg"
                  alt="Profile picture"
                  class="h-full w-full object-cover"
                />
              </div>

              <div
                class="mt-4 space-y-2 text-sm text-slate-700 dark:text-slate-200"
              >
                <div class="flex items-center gap-2">
                  <i data-lucide="map-pin" class="h-4 w-4 text-slate-500"></i>
                  <span id="heroLocation"></span>
                </div>

                <div class="flex items-center gap-2">
                  <i data-lucide="briefcase" class="h-4 w-4 text-slate-500"></i>
                  <span id="heroWorkModes"></span>
                </div>
                <div class="flex items-center gap-2">
                  <i data-lucide="phone" class="h-4 w-4 text-slate-500"></i>
                  <span id="heroNumber"></span>
                </div>
                <!-- <div class="flex items-center gap-2">
                  <i data-lucide="clock" class="h-4 w-4 text-slate-500"></i>
                  <span id="heroTimezone"></span>
                </div> -->
                <div class="flex items-center gap-2">
                  <i data-lucide="mail" class="h-4 w-4 text-slate-500"></i>
                  <a
                    id="heroEmail"
                    class="underline underline-offset-4 hover:no-underline"
                    href="#"
                  ></a>
                </div>
              </div>
            </div>
          </div>
          <div>
            <p
              id="heroKicker"
              class="text-sm font-semibold uppercase tracking-wide text-cyan-700 dark:text-cyan-300"
            ></p>
            <h1
              id="heroName"
              class="mt-2 text-3xl font-semibold tracking-tight text-slate-950 sm:text-5xl dark:text-white"
            ></h1>
            <p
              id="heroTitle"
              class="mt-3 max-w-3xl text-base font-medium leading-7 text-cyan-900 dark:text-cyan-100 sm:text-lg"
            ></p>
            <p
              id="heroSummary"
              class="mt-4 max-w-3xl whitespace-pre-line text-[15px] leading-7 text-slate-700 dark:text-slate-300"
            ></p>
            <!-- 
            <div class="mt-6 flex flex-wrap gap-3">
              <a
                href="#contact"
                class="inline-flex items-center gap-2 rounded-2xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow-soft hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white"
              >
                <i data-lucide="send" class="h-4 w-4"></i>
                Contact
              </a>
              <a
                id="cvBtn"
                href="#"
                class="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800"
                aria-label="Download CV"
              >
                <i data-lucide="download" class="h-4 w-4"></i>
                Download CV
              </a>
            </div> -->

            <div
              id="heroLinks"
              class="mt-6 flex flex-wrap items-center justify-start gap-3"
            ></div>
          </div>
        </div>
      </section>

      <!-- About -->
      <!-- <section id="about" class="py-10">
        <div
          class="rounded-5xl border border-slate-200 bg-white/75 p-6 shadow-soft backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/55 sm:p-8"
        >
          <div class="flex items-center gap-3">
            <div
              class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-slate-50"
            >
              <i data-lucide="user-round" class="h-5 w-5"></i>
            </div>
            <h2 class="text-xl font-semibold tracking-tight">About</h2>
          </div>
          <p id="aboutText" class="mt-4 max-w-4xl text-slate-600 dark:text-slate-300"></p>
        </div>
      </section> -->

      <!-- Project filters -->
      <section id="filters" class="my-8 rounded-lg border border-cyan-100/80 bg-cyan-50/45 p-4 dark:border-cyan-950/70 dark:bg-cyan-950/15 sm:p-5">
        <div
          class="rounded-lg border border-slate-200 bg-white/85 p-5 shadow-soft backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/60 sm:p-6"
        >
          <div
            class="flex flex-col gap-4"
          >
            <div>
              <div class="flex items-center gap-3">
                <div
                  class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-200"
                >
                  <i data-lucide="filter" class="h-5 w-5"></i>
                </div>
                <div>
                  <h2
                    id="titleRoles"
                    class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white"
                  >
                    Roles
                  </h2>

                  <p
                    id="rolesHint"
                    class="mt-1 max-w-3xl text-sm leading-6 text-slate-600 dark:text-slate-300"
                  ></p>
                </div>
              </div>

              <div
                id="roleChips"
                class="mt-5 grid gap-2 sm:grid-cols-2 lg:grid-cols-3"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Skills -->
      <section id="skills" class="my-8 rounded-lg border border-rose-100/80 bg-rose-50/40 p-5 dark:border-rose-950/70 dark:bg-rose-950/15 sm:p-6">
        <div class="flex items-center gap-3">
          <div
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-200"
          >
            <i data-lucide="sparkles" class="h-5 w-5"></i>
          </div>
          <h2 id="titleSkills" class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white">
            Skills
          </h2>
        </div>

        <div
          id="skillsGrid"
          class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </section>

      <!-- Projects -->
      <section id="projects" class="my-8 rounded-lg border border-cyan-100/80 bg-white/60 p-5 dark:border-cyan-950/70 dark:bg-cyan-950/10 sm:p-6">
        <div class="flex items-center gap-3">
          <div
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-200"
          >
            <i data-lucide="folder-kanban" class="h-5 w-5"></i>
          </div>
          <h2 id="titleProjects" class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white">
            Projects
          </h2>
        </div>

        <div id="activeRolePill" class="mt-4 hidden"></div>

        <div
          id="projectsGrid"
          class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
        ></div>

        <div
          id="projectsEmptyState"
          class="mt-6 hidden rounded-lg border border-slate-200 bg-white/90 p-8 text-center text-slate-700 shadow-soft backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/70 dark:text-slate-200"
        >
          <p class="text-base font-semibold">No projects match this role.</p>
          <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">
            Clear the selection to view all projects.
          </p>
        </div>
      </section>

      <!-- Experience -->
      <section id="experience" class="my-8 rounded-lg border border-emerald-100/80 bg-emerald-50/40 p-5 dark:border-emerald-950/70 dark:bg-emerald-950/15 sm:p-6">
        <div class="flex items-center gap-3">
          <div
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200"
          >
            <i data-lucide="briefcase" class="h-5 w-5"></i>
          </div>
          <h2 id="titleExperience" class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white">
            Experience
          </h2>
        </div>

        <div id="experienceList" class="mt-6 space-y-4"></div>
      </section>

      <!-- Education -->
      <section id="education" class="my-8 rounded-lg border border-violet-100/80 bg-violet-50/40 p-5 dark:border-violet-950/70 dark:bg-violet-950/15 sm:p-6">
        <div class="flex items-center gap-3">
          <div
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-violet-100 text-violet-800 dark:bg-violet-950 dark:text-violet-200"
          >
            <i data-lucide="graduation-cap" class="h-5 w-5"></i>
          </div>
          <h2 id="titleEducation" class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white">
            Education
          </h2>
        </div>

        <div id="educationList" class="mt-6 grid gap-4 sm:grid-cols-2"></div>
      </section>

      <!-- Contact -->
      <section id="contact" class="my-8 rounded-lg border border-cyan-100/80 bg-cyan-50/45 p-4 pb-5 dark:border-cyan-950/70 dark:bg-cyan-950/15 sm:p-5">
        <div
          class="rounded-lg border border-cyan-100 bg-white/90 p-6 shadow-soft backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/70 sm:p-8"
        >
          <div class="flex items-center gap-3">
            <div
              class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-200"
            >
              <i data-lucide="mail" class="h-5 w-5"></i>
            </div>
            <h2 id="titleContact" class="text-xl font-semibold tracking-tight text-slate-950 dark:text-white">
              Contact
            </h2>
          </div>

          <p
            id="contactHint"
            class="mt-2 max-w-3xl text-sm leading-6 text-slate-600 dark:text-slate-300"
          ></p>

          <div id="contactLinks" class="mt-6 flex flex-wrap gap-3"></div>
        </div>
      </section>
    </main>

    <!-- Modal -->
    <div
      id="modalOverlay"
      class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 p-4"
      aria-hidden="true"
    >
      <div
        id="modalDialog"
        class="w-full max-w-3xl overflow-hidden rounded-5xl border border-slate-200 bg-white shadow-soft dark:border-slate-800 dark:bg-slate-950"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div
          class="flex items-center justify-between border-b border-slate-200 px-5 py-4 dark:border-slate-800"
        >
          <div class="min-w-0">
            <p
              id="modalKicker"
              class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
            ></p>
            <h3
              id="modalTitle"
              class="truncate text-base font-semibold text-slate-900 dark:text-slate-50"
            ></h3>
          </div>
          <button
            id="modalCloseBtn"
            class="inline-flex h-10 w-10 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800"
            type="button"
            aria-label="Close modal"
          >
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>

        <div id="modalBody" class="max-h-[78vh] overflow-auto px-5 py-5"></div>
      </div>
    </div>

    <script src="./src/data.js"></script>
    <script src="./src/local-icons.js"></script>
    <script src="./src/script.js"></script>
  </body>
</html>
